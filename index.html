<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #02060d;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: #00f0ff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Schwebende Hauptkarte mit Glas-Effekt */
    .jarvis-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      border-radius: 30px;
      background: rgba(4, 12, 24, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(0, 240, 255, 0.05);
    }

    /* Haupt-HUD Container */
    .hud-container {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Äußerer cyanfarbener Hauptring */
    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(0, 240, 255, 0.8);
      border-top-color: transparent;
      border-bottom-color: rgba(0, 240, 255, 0.2);
      box-shadow: 
        0 0 25px rgba(0, 240, 255, 0.4),
        inset 0 0 15px rgba(0, 240, 255, 0.2);
      animation: rotateRight 14s linear infinite;
    }

    /* Äußerer Segmente-Ring mit Skalierungststrichen */
    .segmented-ring {
      position: absolute;
      width: 88%;
      height: 88%;
      border-radius: 50%;
      border: 10px dashed rgba(0, 180, 230, 0.4);
      animation: rotateLeft 22s linear infinite;
    }

    /* Gelber Akzent-Bogen */
    .yellow-ring {
      position: absolute;
      width: 74%;
      height: 74%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-left-color: #ffcc00;
      border-bottom-color: #ffcc00;
      filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7));
      animation: pulseYellow 4s ease-in-out infinite alternate, rotateRight 10s linear infinite;
    }

    /* Innerer dunkler Kern-Ring */
    .inner-ring {
      position: absolute;
      width: 62%;
      height: 62%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 240, 255, 0.7);
      background: radial-gradient(circle, rgba(0, 40, 70, 0.7) 0%, rgba(2, 6, 13, 0.95) 80%);
      box-shadow: 
        0 0 20px rgba(0, 240, 255, 0.3),
        inset 0 0 25px rgba(0, 240, 255, 0.4);
      animation: pulseCore 3s ease-in-out infinite alternate;
    }

    /* Tech-Punkte um den Schriftzug */
    .tech-dots {
      position: absolute;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 2px dotted rgba(255, 255, 255, 0.3);
      animation: rotateLeft 15s linear infinite;
    }

    /* JARVIS Schriftzug in der Mitte */
    .jarvis-title {
      position: relative;
      z-index: 10;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 
        0 0 10px #00f0ff,
        0 0 25px #00f0ff,
        0 0 40px #00f0ff;
    }

    /* Statusanzeige */
    #status {
      margin-top: 35px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #72a1c8;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
      min-height: 24px;
    }

    /* Animationen */
    @keyframes rotateRight {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateLeft {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.97); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.3); }
      100% { transform: scale(1.03); box-shadow: inset 0 0 35px rgba(0, 240, 255, 0.6); }
    }

    @keyframes pulseYellow {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="jarvis-wrapper">
    <div class="hud-container">
      <div class="outer-ring"></div>
      <div class="segmented-ring"></div>
      <div class="yellow-ring"></div>
      <div class="inner-ring"></div>
      <div class="tech-dots"></div>
      <div class="jarvis-title">J.A.R.V.I.S.</div>
    </div>

    <div id="status">Tippe auf den Bildschirm & sag "Hey Jarvis"</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
